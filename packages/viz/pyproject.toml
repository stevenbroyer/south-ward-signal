[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sws-viz"
version = "1.0.0"
description = "South Ward Signal — Data visualization pipeline for NYRB coverage"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "South Ward Signal" }]

dependencies = [
    "mplsoccer>=1.3.0",
    "matplotlib>=3.9.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
sws-viz = "src.generate:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
